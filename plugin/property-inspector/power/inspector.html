<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neewer Power</title>
    <link rel="stylesheet" href="../../libs/css/uspi.css" />
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body data-actionid="com.ulanzi.ulanzistudio.neewer.power">
    <div class="uspi-wrapper">
    <form id="property-inspector">
    <h1>Neewer Power</h1>
    <p class="sub">Toggle the RGB62, or force it on / off.</p>

      <section>
        <h2>Device</h2>
        <label class="uspi-item">
          <span class="uspi-item-label">Controlled light</span>
          <select class="uspi-item-value" name="device" id="device"></select>
        </label>
        <p class="hint" id="device-hint">Add and name lights from the Neewer Scan action.</p>
      </section>

      <section>
        <h2>Action</h2>
        <label class="uspi-item">
          <span class="uspi-item-label">On key press</span>
          <select class="uspi-item-value" name="behaviour">
            <option value="toggle">Toggle</option>
            <option value="on">Always turn on</option>
            <option value="off">Always turn off</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Light</h2>
        <div class="status" id="link">
          <span class="dot"></span><span class="label">connecting...</span>
        </div>
        <p class="hint mono" id="detail">no device configured</p>
        <p class="error" id="error" style="display: none"></p>
      </section>

    </form>
    </div>

    <script src="../../libs/js/constants.js"></script>
    <script src="../../libs/js/eventEmitter.js"></script>
    <script src="../../libs/js/timers.js"></script>
    <script src="../../libs/js/utils.js"></script>
    <script src="../../libs/js/ulanziApi.js"></script>
    <script src="../shared.js"></script>
    <script src="inspector.js"></script>
  </body>
</html>
