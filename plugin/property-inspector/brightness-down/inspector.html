<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neewer Brightness Down</title>
    <link rel="stylesheet" href="../../libs/css/uspi.css" />
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body data-actionid="com.ulanzi.ulanzistudio.neewer.brightness-down">
    <div class="uspi-wrapper">
    <form id="property-inspector">
    <h1>Neewer Brightness Down</h1>
    <p class="sub">Every press makes the light one step dimmer.</p>

      <section>
        <h2>Device</h2>
        <label class="uspi-item">
          <span class="uspi-item-label">Controlled light</span>
          <select class="uspi-item-value" name="device" id="device"></select>
        </label>
        <p class="hint" id="device-hint">Add and name lights from the Neewer Scan action.</p>
      </section>

      <section>
        <h2>Press</h2>
        <label class="uspi-item">
          <span class="uspi-item-label">Step</span>
          <select class="uspi-item-value" name="step">
            <option value="5">5</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="10">10</option>
            <option value="25">25</option>
          </select>
        </label>
        <p class="hint">Stops at 1%. Put the Brightness action on a dial to sweep instead.</p>
      </section>

      <section>
        <h2>Light</h2>
        <div class="status" id="link"><span class="dot"></span><span class="label">connecting...</span></div>
        <p class="hint mono" id="detail">no device configured</p>
        <p class="error" id="error" style="display: none"></p>
      </section>

    </form>
    </div>

    <script src="../../libs/js/constants.js"></script>
    <script src="../../libs/js/eventEmitter.js"></script>
    <script src="../../libs/js/timers.js"></script>
    <script src="../../libs/js/utils.js"></script>
    <script src="../../libs/js/ulanziApi.js"></script>
    <script src="../shared.js"></script>
    <script src="../stepper.js"></script>
    <script src="inspector.js"></script>
  </body>
</html>
